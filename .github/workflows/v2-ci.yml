name: V2 CI
on:
  push:
    branches: [v2-development]
  pull_request:
    branches: [main, v2-development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
        env:
          PYTHONPATH: .
      - name: Print evaluation metrics
        env:
          PYTHONPATH: .
        run: python -c "from app.evaluation.report import build_evaluation_report; import json; print(json.dumps(build_evaluation_report(), indent=2))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start database and API
        run: docker compose up -d db api
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api db
          exit 1
      - name: Verify API and Alembic state
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/api/v1/projects
          PROJECT_JSON=$(curl --fail --silent -X POST http://localhost:8000/api/v1/projects \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke Project","description":"Created by Docker smoke test"}')
          echo "$PROJECT_JSON"
          echo "$PROJECT_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["name"]=="CI Smoke Project"; assert isinstance(data["id"], int)'
          curl --fail --silent http://localhost:8000/api/v1/projects | python3 -c 'import json,sys; data=json.load(sys.stdin); assert any(p["name"]=="CI Smoke Project" for p in data)'
          MIGRATION=$(docker compose exec -T api alembic current)
          echo "$MIGRATION"
          echo "$MIGRATION" | grep -q "0006_active_scan_uniqueness (head)"
          docker compose exec -T db psql -U guardian -d guardian -tAc "SELECT to_regclass('public.projects')" | grep -qx "projects"
          docker compose exec -T db psql -U guardian -d guardian -tAc "SELECT to_regclass('public.scans')" | grep -qx "scans"
          docker compose exec -T db psql -U guardian -d guardian -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='scans' AND column_name='route'" | grep -qx "route"
          docker compose exec -T db psql -U guardian -d guardian -tAc "SELECT indexname FROM pg_indexes WHERE tablename='scans' AND indexname='uq_scans_active_role_per_route'" | grep -qx "uq_scans_active_role_per_route"
          docker compose exec -T db psql -U guardian -d guardian -v ON_ERROR_STOP=1 -c "INSERT INTO scans (project_id,url,route,title,role,total_testable_objects,payload_json) SELECT id,'https://example.com/ci','/ci-unique','','baseline',0,'{}' FROM projects WHERE name='CI Smoke Project';"
          if docker compose exec -T db psql -U guardian -d guardian -v ON_ERROR_STOP=1 -c "INSERT INTO scans (project_id,url,route,title,role,total_testable_objects,payload_json) SELECT id,'https://example.com/ci-duplicate','/ci-unique','','baseline',0,'{}' FROM projects WHERE name='CI Smoke Project';"; then
            echo "Expected duplicate active scan insert to fail"
            exit 1
          fi
          docker compose exec -T db psql -U guardian -d guardian -tAc "SELECT to_regclass('public.knowledge_documents')" | grep -qx "knowledge_documents"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color api db
      - name: Stop stack
        if: always()
        run: docker compose down -v
