name: V2 CI
on:
  push:
    branches: [v2-development]
  pull_request:
    branches: [main, v2-development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
        env:
          PYTHONPATH: .
      - name: Print evaluation metrics
        env:
          PYTHONPATH: .
        run: python -c "from app.evaluation.report import build_evaluation_report; import json; print(json.dumps(build_evaluation_report(), indent=2))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start database and API
        run: docker compose up -d db api
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api db
          exit 1
      - name: Verify API and Alembic state
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/api/v1/projects
          docker compose exec -T api alembic current
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color api db
      - name: Stop stack
        if: always()
        run: docker compose down -v
